<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Key Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Video Background */
        .video-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            overflow: hidden;
        }
        .video-bg video {
            position: absolute;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        /* Overlay */
        .video-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.35) 40%, rgba(0,0,0,0.55) 100%);
            z-index: 1;
        }

        /* Noise */
        .noise {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            opacity: 0.04;
            mix-blend-mode: overlay;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 128px 128px;
        }

        /* Tech grid */
        .tech-grid {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.015) 1px, transparent 1px);
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
        }

        /* Spotlight */
        .spotlight-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 4;
            pointer-events: none;
        }
        .spotlight {
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out;
        }

        /* White glass card */
        .key-card {
            position: relative;
            z-index: 10;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(30px) saturate(1.3);
            -webkit-backdrop-filter: blur(30px) saturate(1.3);
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 20px;
            box-shadow:
                0 8px 60px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.12),
                inset 0 -1px 0 rgba(0,0,0,0.05);
            transition: all 0.4s ease;
        }
        .key-card:hover {
            border-color: rgba(255,255,255,0.2);
            box-shadow:
                0 8px 60px rgba(0,0,0,0.4),
                0 0 50px rgba(255,255,255,0.03),
                inset 0 1px 0 rgba(255,255,255,0.12);
        }

        /* Key display box */
        .key-display {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .key-display::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.08), transparent);
            transition: left 0.5s ease;
        }
        .key-display:hover::before { left: 100%; }
        .key-display:hover {
            border-color: rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.35);
        }
        .key-display:active { transform: scale(0.985); }
        .key-display.copied {
            border-color: rgba(0,255,196,0.4);
            background: rgba(0,255,196,0.06);
        }
        .key-display.no-key {
            cursor: default;
        }
        .key-display.no-key:hover::before { left: -100%; }
        .key-display.no-key:hover {
            border-color: rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.3);
        }

        /* Scanline */
        @keyframes scanline {
            0% { top: -2px; }
            100% { top: 100%; }
        }
        .key-display.scanning::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 2px;
            background: linear-gradient(to right, transparent, #00ffc4, transparent);
            animation: scanline 0.8s ease-out forwards;
            z-index: 2;
        }

        /* Pulse dot */
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; box-shadow: 0 0 6px #00ffc4; }
            50% { opacity: 0.4; box-shadow: 0 0 2px #00ffc4; }
        }
        .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }

        /* Loading spinner */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: rgba(255,255,255,0.4);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 100px;
            padding: 0.6rem 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Entrance */
        @keyframes cardIn {
            0% { opacity: 0; transform: translateY(24px) scale(0.96); filter: blur(12px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        .card-in { animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }

        /* Glow ring */
        @keyframes glowPulse {
            0%, 100% { opacity: 0.25; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.4; transform: translate(-50%, -50%) scale(1.05); }
        }
        .glow-ring {
            position: absolute;
            top: 50%; left: 50%;
            width: 120%; height: 120%;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse, rgba(255,255,255,0.04) 0%, transparent 70%);
            border-radius: 50%;
            animation: glowPulse 4s ease-in-out infinite;
            pointer-events: none;
            z-index: 9;
        }
    </style>
</head>
<body>

    <!-- Video Background -->
    <div class="video-bg">
        <video autoplay muted loop playsinline>
            <source src="https://videotourl.com/videos/1787016473357-9c6b84e2-d7f9-431f-9794-cf7f11dd566e.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Overlay -->
    <div class="video-overlay"></div>

    <!-- Tech Grid -->
    <div class="tech-grid"></div>

    <!-- Noise -->
    <div class="noise"></div>

    <!-- Spotlight -->
    <div class="spotlight-container">
        <div class="spotlight" id="spotlight"></div>
    </div>

    <!-- Glow ring -->
    <div class="glow-ring"></div>

    <!-- Key Card -->
    <div class="key-card card-in w-full max-w-md mx-4 p-8">

        <!-- Header -->
        <div class="flex items-center gap-3 mb-6">
            <div class="w-9 h-9 rounded-xl bg-white/10 border border-white/10 flex items-center justify-center">
                <iconify-icon icon="ph:key-fill" style="font-size: 16px; color: #00ffc4;"></iconify-icon>
            </div>
            <div>
                <h3 class="text-white text-sm font-medium tracking-tight">License Key</h3>
                <p class="text-white/35 text-[10px] font-medium uppercase tracking-widest">Click to copy</p>
            </div>
            <div class="ml-auto flex items-center gap-1.5" id="statusBadge">
                <span class="w-1.5 h-1.5 rounded-full bg-yellow-400" style="box-shadow: 0 0 6px rgba(250,204,21,0.5);"></span>
                <span class="text-[10px] text-white/45 font-medium">Loading</span>
            </div>
        </div>

        <!-- Divider -->
        <div class="w-full h-px bg-gradient-to-r from-transparent via-white/12 to-transparent mb-6"></div>

        <!-- Label -->
        <label class="block text-[10px] font-semibold uppercase tracking-[0.15em] text-white/35 mb-2.5 pl-1">Key</label>

        <!-- Key Display -->
        <div class="key-display no-key px-5 py-4 flex items-center gap-3" id="keyBox">
            <div class="spinner flex-shrink-0" id="loadingSpinner"></div>
            <span class="font-mono text-sm text-white/30 tracking-wide flex-1 break-all leading-relaxed" id="keyText">Đang tải...</span>
            <div class="flex-shrink-0 w-8 h-8 rounded-lg bg-white/8 flex items-center justify-center transition-all" id="copyBtn" style="display:none;">
                <iconify-icon icon="ph:copy" style="font-size: 14px; color: rgba(255,255,255,0.3);" id="copyIcon"></iconify-icon>
            </div>
        </div>

        <!-- Hint -->
        <p class="text-white/20 text-[10px] mt-3 pl-1 flex items-center gap-1.5" id="hintText">
            <iconify-icon icon="ph:info" style="font-size: 11px;"></iconify-icon>
            Đang kiểm tra key...
        </p>

        <!-- Bottom info -->
        <div class="mt-6 pt-5 border-t border-white/8 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <iconify-icon icon="ph:shield-check-fill" style="font-size: 14px; color: #00ffc4;" id="shieldIcon"></iconify-icon>
                <span class="text-[10px] text-white/35 font-medium" id="verifyText">Verifying...</span>
            </div>
            <span class="text-[10px] text-white/20 font-mono">v2.4.1</span>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <iconify-icon icon="ph:check-circle-fill" style="font-size: 16px; color: #00ffc4;" id="toastIcon"></iconify-icon>
        <span class="text-xs text-white/75 font-medium" id="toastText">Đã sao chép!</span>
    </div>

    <script>
        // Spotlight
        const spotlight = document.getElementById('spotlight');
        document.addEventListener('mousemove', (e) => {
            spotlight.style.left = e.clientX + 'px';
            spotlight.style.top = e.clientY + 'px';
        });

        // Elements
        const keyBox = document.getElementById('keyBox');
        const keyText = document.getElementById('keyText');
        const copyBtn = document.getElementById('copyBtn');
        const copyIcon = document.getElementById('copyIcon');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const statusBadge = document.getElementById('statusBadge');
        const hintText = document.getElementById('hintText');
        const verifyText = document.getElementById('verifyText');
        const shieldIcon = document.getElementById('shieldIcon');
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toastText');
        const toastIcon = document.getElementById('toastIcon');
        let toastTimer;
        let currentKey = '';

        // Lấy key từ URL
        function getKeyFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('key');
        }

        // Giả lập loading rồi hiện kết quả
        function init() {
            const key = getKeyFromURL();

            setTimeout(() => {
                if (key && key.trim() !== '') {
                    currentKey = key.trim();

                    // Ẩn spinner, hiện copy btn
                    loadingSpinner.style.display = 'none';
                    copyBtn.style.display = 'flex';

                    // Hiện key
                    keyText.textContent = currentKey;
                    keyText.style.color = 'rgba(255,255,255,0.8)';

                    // Bỏ class no-key, thêm onclick
                    keyBox.classList.remove('no-key');
                    keyBox.setAttribute('onclick', 'copyKey()');

                    // Status → Active
                    statusBadge.innerHTML = `
                        <span class="w-1.5 h-1.5 rounded-full bg-[#00ffc4] pulse-dot"></span>
                        <span class="text-[10px] text-white/45 font-medium">Active</span>
                    `;

                    // Hint
                    hintText.innerHTML = `
                        <iconify-icon icon="ph:info" style="font-size: 11px;"></iconify-icon>
                        Nhấn vào key để sao chép vào clipboard
                    `;

                    // Verify
                    verifyText.textContent = 'Verified';
                } else {
                    // Không có key
                    loadingSpinner.style.display = 'none';

                    keyText.textContent = 'Thêm ?key=YOUR_KEY vào URL';
                    keyText.style.color = 'rgba(255,255,255,0.2)';
                    keyText.style.fontSize = '12px';

                    statusBadge.innerHTML = `
                        <span class="w-1.5 h-1.5 rounded-full bg-red-400" style="box-shadow: 0 0 6px rgba(248,113,113,0.5);"></span>
                        <span class="text-[10px] text-white/45 font-medium">No Key</span>
                    `;

                    hintText.innerHTML = `
                        <iconify-icon icon="ph:warning" style="font-size: 11px; color: rgba(248,113,113,0.5);"></iconify-icon>
                        <span style="color: rgba(248,113,113,0.4);">Không tìm thấy key trong URL</span>
                    `;

                    shieldIcon.style.color = 'rgba(248,113,113,0.5)';
                    shieldIcon.setAttribute('icon', 'ph:shield-warning-fill');
                    verifyText.textContent = 'Invalid';
                }
            }, 800);
        }

        function copyKey() {
            if (!currentKey) return;

            navigator.clipboard.writeText(currentKey).then(() => {
                showCopied();
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = currentKey;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showCopied();
            });
        }

        function showCopied() {
            keyBox.classList.add('copied', 'scanning');
            copyIcon.setAttribute('icon', 'ph:check');
            copyIcon.style.color = '#00ffc4';
            copyBtn.style.background = 'rgba(0,255,196,0.12)';

            toastIcon.setAttribute('icon', 'ph:check-circle-fill');
            toastIcon.style.color = '#00ffc4';
            toastText.textContent = 'Đã sao chép key!';
            toast.style.borderColor = 'rgba(0,255,196,0.2)';
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);

            setTimeout(() => {
                keyBox.classList.remove('copied', 'scanning');
                copyIcon.setAttribute('icon', 'ph:copy');
                copyIcon.style.color = 'rgba(255,255,255,0.3)';
                copyBtn.style.background = 'rgba(255,255,255,0.08)';
            }, 1500);
        }

        // Auto play video
        const video = document.querySelector('.video-bg video');
        if (video) {
            video.play().catch(() => {
                const playVideo = () => {
                    video.play().catch(() => {});
                    document.removeEventListener('click', playVideo);
                };
                document.addEventListener('click', playVideo);
            });
        }

        // Start
        init();
    </script>
</body>
</html>
