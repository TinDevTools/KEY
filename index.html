<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Key Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .video-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            overflow: hidden;
        }
        .video-bg video {
            position: absolute;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        .video-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.35) 40%, rgba(0,0,0,0.55) 100%);
            z-index: 1;
        }

        .noise {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            opacity: 0.04;
            mix-blend-mode: overlay;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 128px 128px;
        }

        .tech-grid {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.015) 1px, transparent 1px);
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
        }

        .spotlight-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 4;
            pointer-events: none;
        }
        .spotlight {
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out;
        }

        .key-card {
            position: relative;
            z-index: 10;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(30px) saturate(1.3);
            -webkit-backdrop-filter: blur(30px) saturate(1.3);
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 20px;
            box-shadow:
                0 8px 60px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.12),
                inset 0 -1px 0 rgba(0,0,0,0.05);
            transition: all 0.4s ease;
        }
        .key-card:hover {
            border-color: rgba(255,255,255,0.2);
            box-shadow:
                0 8px 60px rgba(0,0,0,0.4),
                0 0 50px rgba(255,255,255,0.03),
                inset 0 1px 0 rgba(255,255,255,0.12);
        }

        .key-display {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .key-display::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.08), transparent);
            transition: left 0.5s ease;
        }
        .key-display:hover::before { left: 100%; }
        .key-display:hover {
            border-color: rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.35);
        }
        .key-display:active { transform: scale(0.985); }
        .key-display.copied {
            border-color: rgba(0,255,196,0.4);
            background: rgba(0,255,196,0.06);
        }
        .key-display.no-key { cursor: default; }
        .key-display.no-key:hover::before { left: -100%; }
        .key-display.no-key:hover {
            border-color: rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.3);
        }

        @keyframes scanline {
            0% { top: -2px; }
            100% { top: 100%; }
        }
        .key-display.scanning::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 2px;
            background: linear-gradient(to right, transparent, #00ffc4, transparent);
            animation: scanline 0.8s ease-out forwards;
            z-index: 2;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; box-shadow: 0 0 6px #00ffc4; }
            50% { opacity: 0.4; box-shadow: 0 0 2px #00ffc4; }
        }
        .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: rgba(255,255,255,0.4);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 100px;
            padding: 0.6rem 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes cardIn {
            0% { opacity: 0; transform: translateY(24px) scale(0.96); filter: blur(12px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        .card-in { animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.25; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.4; transform: translate(-50%, -50%) scale(1.05); }
        }
        .glow-ring {
            position: absolute;
            top: 50%; left: 50%;
            width: 120%; height: 120%;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse, rgba(255,255,255,0.04) 0%, transparent 70%);
            border-radius: 50%;
            animation: glowPulse 4s ease-in-out infinite;
            pointer-events: none;
            z-index: 9;
        }

        /* ========== MUSIC BUTTON ========== */
        .music-btn {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 50;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .music-btn:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.2);
            transform: scale(1.05);
            box-shadow: 0 4px 30px rgba(0,0,0,0.4);
        }
        .music-btn:active { transform: scale(0.95); }
        .music-btn.playing {
            border-color: rgba(0,255,196,0.2);
            box-shadow: 0 4px 20px rgba(0,255,196,0.08), 0 0 30px rgba(0,255,196,0.05);
        }

        .eq-bars {
            display: flex;
            align-items: flex-end;
            gap: 2.5px;
            height: 18px;
        }
        .eq-bar {
            width: 3px;
            border-radius: 2px;
            background: rgba(255,255,255,0.5);
            transition: height 0.15s ease, background 0.3s ease;
        }
        .eq-bar.animating { animation: eqBounce 0.6s ease-in-out infinite alternate; }
        .eq-bar:nth-child(1) { height: 6px; animation-delay: 0s; }
        .eq-bar:nth-child(2) { height: 12px; animation-delay: 0.15s; }
        .eq-bar:nth-child(3) { height: 8px; animation-delay: 0.3s; }
        .eq-bar:nth-child(4) { height: 15px; animation-delay: 0.1s; }
        .eq-bar:nth-child(5) { height: 5px; animation-delay: 0.25s; }

        @keyframes eqBounce {
            0% { height: 4px; }
            100% { height: 18px; }
        }

        .eq-bar.paused {
            animation: none !important;
            height: 3px !important;
            background: rgba(255,255,255,0.25);
        }

        .music-label {
            position: fixed;
            bottom: 1.5rem;
            right: 4.5rem;
            z-index: 50;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 100px;
            padding: 0.45rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0;
            transform: translateX(8px);
            transition: all 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        .music-label.show {
            opacity: 1;
            transform: translateX(0);
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both; }
    </style>
</head>
<body>

    <!-- Video Background -->
    <div class="video-bg">
        <video id="bgVideo" autoplay muted loop playsinline>
            <source src="https://videotourl.com/videos/1787016473357-9c6b84e2-d7f9-431f-9794-cf7f11dd566e.mp4" type="video/mp4" />
        </video>
    </div>

    <div class="video-overlay"></div>
    <div class="tech-grid"></div>
    <div class="noise"></div>

    <div class="spotlight-container">
        <div class="spotlight" id="spotlight"></div>
    </div>

    <div class="glow-ring"></div>

    <!-- Key Card -->
    <div class="key-card card-in w-full max-w-md mx-4 p-8">

        <div class="flex items-center gap-3 mb-6">
            <div class="w-9 h-9 rounded-xl bg-white/10 border border-white/10 flex items-center justify-center">
                <iconify-icon icon="ph:key-fill" style="font-size: 16px; color: #00ffc4;"></iconify-icon>
            </div>
            <div>
                <h3 class="text-white text-sm font-medium tracking-tight">License Key</h3>
                <p class="text-white/35 text-[10px] font-medium uppercase tracking-widest">Click to copy</p>
            </div>
            <div class="ml-auto flex items-center gap-1.5" id="statusBadge">
                <span class="w-1.5 h-1.5 rounded-full bg-yellow-400" style="box-shadow: 0 0 6px rgba(250,204,21,0.5);"></span>
                <span class="text-[10px] text-white/45 font-medium">Loading</span>
            </div>
        </div>

        <div class="w-full h-px bg-gradient-to-r from-transparent via-white/12 to-transparent mb-6"></div>

        <label class="block text-[10px] font-semibold uppercase tracking-[0.15em] text-white/35 mb-2.5 pl-1">Key</label>

        <div class="key-display no-key px-5 py-4 flex items-center gap-3" id="keyBox">
            <div class="spinner flex-shrink-0" id="loadingSpinner"></div>
            <span class="font-mono text-sm text-white/30 tracking-wide flex-1 break-all leading-relaxed" id="keyText">Đang tải...</span>
            <div class="flex-shrink-0 w-8 h-8 rounded-lg bg-white/8 flex items-center justify-center transition-all" id="copyBtn" style="display:none;">
                <iconify-icon icon="ph:copy" style="font-size: 14px; color: rgba(255,255,255,0.3);" id="copyIcon"></iconify-icon>
            </div>
        </div>

        <p class="text-white/20 text-[10px] mt-3 pl-1 flex items-center gap-1.5" id="hintText">
            <iconify-icon icon="ph:info" style="font-size: 11px;"></iconify-icon>
            Đang kiểm tra key...
        </p>

        <div class="mt-6 pt-5 border-t border-white/8 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <iconify-icon icon="ph:shield-check-fill" style="font-size: 14px; color: #00ffc4;" id="shieldIcon"></iconify-icon>
                <span class="text-[10px] text-white/35 font-medium" id="verifyText">Verifying...</span>
            </div>
            <span class="text-[10px] text-white/20 font-mono">v2.4.1</span>
        </div>
    </div>

    <!-- Music Button -->
    <div class="music-btn slide-up" id="musicBtn" onclick="toggleMusic()">
        <div class="eq-bars" id="eqBars">
            <div class="eq-bar paused"></div>
            <div class="eq-bar paused"></div>
            <div class="eq-bar paused"></div>
            <div class="eq-bar paused"></div>
            <div class="eq-bar paused"></div>
        </div>
    </div>

    <!-- Music Label -->
    <div class="music-label" id="musicLabel">
        <iconify-icon icon="ph:speaker-slash" style="font-size: 13px; color: rgba(255,255,255,0.4);" id="labelIcon"></iconify-icon>
        <span class="text-[11px] text-white/50 font-medium" id="musicLabelText">Nhấn để bật tiếng</span>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <iconify-icon icon="ph:check-circle-fill" style="font-size: 16px; color: #00ffc4;" id="toastIcon"></iconify-icon>
        <span class="text-xs text-white/75 font-medium" id="toastText">Đã sao chép!</span>
    </div>

    <script>
        // Spotlight
        const spotlight = document.getElementById('spotlight');
        document.addEventListener('mousemove', (e) => {
            spotlight.style.left = e.clientX + 'px';
            spotlight.style.top = e.clientY + 'px';
        });

        // Elements
        const keyBox = document.getElementById('keyBox');
        const keyText = document.getElementById('keyText');
        const copyBtn = document.getElementById('copyBtn');
        const copyIcon = document.getElementById('copyIcon');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const statusBadge = document.getElementById('statusBadge');
        const hintText = document.getElementById('hintText');
        const verifyText = document.getElementById('verifyText');
        const shieldIcon = document.getElementById('shieldIcon');
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toastText');
        const toastIcon = document.getElementById('toastIcon');
        let toastTimer;
        let currentKey = '';

        // Video
        const bgVideo = document.getElementById('bgVideo');

        // ========== KEY LOGIC ==========
        function getKeyFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('key');
        }

        function init() {
            const key = getKeyFromURL();
            setTimeout(() => {
                if (key && key.trim() !== '') {
                    currentKey = key.trim();
                    loadingSpinner.style.display = 'none';
                    copyBtn.style.display = 'flex';
                    keyText.textContent = currentKey;
                    keyText.style.color = 'rgba(255,255,255,0.8)';
                    keyBox.classList.remove('no-key');
                    keyBox.setAttribute('onclick', 'copyKey()');
                    statusBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-[#00ffc4] pulse-dot"></span><span class="text-[10px] text-white/45 font-medium">Active</span>';
                    hintText.innerHTML = '<iconify-icon icon="ph:info" style="font-size: 11px;"></iconify-icon> Nhấn vào key để sao chép vào clipboard';
                    verifyText.textContent = 'Verified';
                } else {
                    loadingSpinner.style.display = 'none';
                    keyText.textContent = 'Thêm ?key=YOUR_KEY vào URL';
                    keyText.style.color = 'rgba(255,255,255,0.2)';
                    keyText.style.fontSize = '12px';
                    statusBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-red-400" style="box-shadow: 0 0 6px rgba(248,113,113,0.5);"></span><span class="text-[10px] text-white/45 font-medium">No Key</span>';
                    hintText.innerHTML = '<iconify-icon icon="ph:warning" style="font-size: 11px; color: rgba(248,113,113,0.5);"></iconify-icon><span style="color: rgba(248,113,113,0.4);">Không tìm thấy key trong URL</span>';
                    shieldIcon.style.color = 'rgba(248,113,113,0.5)';
                    shieldIcon.setAttribute('icon', 'ph:shield-warning-fill');
                    verifyText.textContent = 'Invalid';
                }
            }, 800);
        }

        function copyKey() {
            if (!currentKey) return;
            navigator.clipboard.writeText(currentKey).then(() => showCopied()).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = currentKey;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showCopied();
            });
        }

        function showCopied() {
            keyBox.classList.add('copied', 'scanning');
            copyIcon.setAttribute('icon', 'ph:check');
            copyIcon.style.color = '#00ffc4';
            copyBtn.style.background = 'rgba(0,255,196,0.12)';
            toastIcon.setAttribute('icon', 'ph:check-circle-fill');
            toastIcon.style.color = '#00ffc4';
            toastText.textContent = 'Đã sao chép key!';
            toast.style.borderColor = 'rgba(0,255,196,0.2)';
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
            setTimeout(() => {
                keyBox.classList.remove('copied', 'scanning');
                copyIcon.setAttribute('icon', 'ph:copy');
                copyIcon.style.color = 'rgba(255,255,255,0.3)';
                copyBtn.style.background = 'rgba(255,255,255,0.08)';
            }, 1500);
        }

        // ========== MUSIC LOGIC - TỰ ĐỘNG BẬT NHẠC ==========
        const musicBtn = document.getElementById('musicBtn');
        const eqBars = document.querySelectorAll('.eq-bar');
        const musicLabel = document.getElementById('musicLabel');
        const musicLabelText = document.getElementById('musicLabelText');
        const labelIcon = document.getElementById('labelIcon');
        let isMuted = true;
        let labelTimer;

        // Cập nhật giao diện nút nhạc
        function updateMusicUI(playing) {
            if (playing) {
                isMuted = false;
                eqBars.forEach(bar => {
                    bar.classList.remove('paused');
                    bar.classList.add('animating');
                });
                musicBtn.classList.add('playing');
                labelIcon.setAttribute('icon', 'ph:speaker-high');
                musicLabelText.textContent = 'Đang phát...';
            } else {
                isMuted = true;
                eqBars.forEach(bar => {
                    bar.classList.add('paused');
                    bar.classList.remove('animating');
                });
                musicBtn.classList.remove('playing');
                labelIcon.setAttribute('icon', 'ph:speaker-slash');
                musicLabelText.textContent = 'Nhấn để bật tiếng';
            }
        }

        function showMusicToast(msg, icon) {
            toastIcon.setAttribute('icon', icon);
            toastIcon.style.color = 'rgba(255,255,255,0.6)';
            toastText.textContent = msg;
            toast.style.borderColor = 'rgba(255,255,255,0.15)';
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
        }

        // Bật/tắt tiếng khi bấm nút
        function toggleMusic() {
            if (isMuted) {
                bgVideo.muted = false;
                bgVideo.play().then(() => {
                    updateMusicUI(true);
                    showMusicToast('Đã bật tiếng video', 'ph:speaker-high-fill');
                }).catch(() => {
                    bgVideo.muted = true;
                    updateMusicUI(false);
                    showMusicToast('Không thể bật tiếng', 'ph:warning-fill');
                });
            } else {
                bgVideo.muted = true;
                updateMusicUI(false);
                showMusicToast('Đã tắt tiếng', 'ph:speaker-slash-fill');
            }
            musicLabel.classList.add('show');
            clearTimeout(labelTimer);
            labelTimer = setTimeout(() => musicLabel.classList.remove('show'), 2000);
        }

        // Tự động bật nhạc khi video đã tải xong
        function tryEnableAudio() {
            bgVideo.muted = false;
            bgVideo.play().then(() => {
                updateMusicUI(true);
                showMusicToast('🎵 Tự động bật nhạc', 'ph:speaker-high-fill');
            }).catch(() => {
                bgVideo.muted = true;
                updateMusicUI(false);
            });
        }

        // Gắn sự kiện loadeddata để thử bật nhạc
        bgVideo.addEventListener('loadeddata', tryEnableAudio);
        // Nếu video đã load trước khi gắn sự kiện thì gọi luôn
        if (bgVideo.readyState >= 1) {
            tryEnableAudio();
        }

        // Đảm bảo video luôn chạy (dù bị chặn autoplay)
        bgVideo.play().catch(() => {});

        // Hiện label khi hover nút
        musicBtn.addEventListener('mouseenter', () => musicLabel.classList.add('show'));
        musicBtn.addEventListener('mouseleave', () => {
            clearTimeout(labelTimer);
            labelTimer = setTimeout(() => musicLabel.classList.remove('show'), 600);
        });

        // Khởi tạo key
        init();
    </script>
</body>
</html>
