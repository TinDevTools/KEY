<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TTP Tool | Trần Quốc Tình</title>
    <meta content="Trần Quốc Tình" property="og:title"/>
    <meta content="Xây dựng và phát triển bởi Trần Quốc Tình !" property="og:description"/>
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css?family=Quicksand:400,500,700&subset=latin-ext" rel="stylesheet"/>
    <style>
        /* ===== RESET & CUSTOM CURSOR ===== */
        html, body {
            cursor: url('https://file.leanhduc.pro.vn/image/mouse_f1.png'), auto;
            position: relative;
            overflow-x: hidden !important;
            margin: 0;
            padding: 0;
        }
        a:hover, button:hover {
            cursor: url('https://file.leanhduc.pro.vn/image/mouse_f1.png'), auto;
        }

        /* Scrollbar đẹp */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 50px;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 50px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            color: #324e63;
            background: #0a0f1e;
        }

        /* Icon SVG inline */
        .icon {
            display: inline-block;
            width: 1em;
            height: 1em;
            stroke-width: 0;
            stroke: currentColor;
            fill: currentColor;
        }

        /* ===== WRAPPER & BACKGROUND VIDEO ===== */
        .wrapper {
            width: 100%;
            height: auto;
            min-height: 100vh;
            padding: 50px 20px;
            padding-top: 100px;
            display: flex;
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }
        
        /* Video nền */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }
        
        .overlay-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        /* ===== PROFILE CARD ===== */
        .profile-card {
            width: 100%;
            min-height: 460px;
            margin: auto;
            box-shadow: 0 8px 60px -10px rgba(13, 28, 39, 0.6);
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(2px);
            border-radius: 12px;
            max-width: 700px;
            position: relative;
            transition: all 0.3s ease;
        }

        .profile-card.active .profile-card__cnt {
            filter: blur(6px);
        }
        .profile-card.active .profile-card-message,
        .profile-card.active .profile-card__overlay {
            opacity: 1;
            pointer-events: auto;
            transition-delay: 0.1s;
        }
        .profile-card.active .profile-card-form {
            transform: none;
            transition-delay: 0.1s;
        }

        /* Avatar */
        .profile-card__img {
            width: 150px;
            height: 150px;
            margin-left: auto;
            margin-right: auto;
            transform: translateY(-50%);
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            z-index: 4;
            box-shadow: 0 5px 50px 0 #6c44fc, 0px 0 0 7px rgba(50, 74, 255, 0.5);
        }
        @media screen and (max-width: 576px) {
            .profile-card__img {
                width: 120px;
                height: 120px;
            }
        }
        .profile-card__img img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Nội dung card */
        .profile-card__cnt {
            margin-top: -35px;
            text-align: center;
            padding: 0 20px;
            padding-bottom: 40px;
            transition: all 0.3s;
        }

        .profile-card__name {
            font-weight: 700;
            font-size: 24px;
            color: #6944ff;
            margin-bottom: 15px;
        }
        .profile-card__txt {
            font-size: 18px;
            font-weight: 500;
            color: #324e63;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .profile-card__txt strong {
            font-weight: 700;
        }

        /* Địa chỉ */
        .profile-card-loc {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
            margin-top: 8px;
        }
        .profile-card-loc__icon {
            display: inline-flex;
            font-size: 27px;
            margin-right: 10px;
        }

        /* KEY TOOL Display */
        .key-display {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #1e2f3a;
            background: #eef2ff;
            padding: 8px 16px;
            border-radius: 50px;
            display: inline-block;
            width: auto;
            backdrop-filter: blur(4px);
        }
        .key-display strong {
            font-weight: 800;
            background: linear-gradient(135deg, #0b2b38, #1f4e6e);
            color: #ffdd77;
            padding: 4px 14px;
            border-radius: 40px;
            margin-left: 8px;
            font-family: monospace;
            letter-spacing: 1px;
        }

        /* Thông tin số */
        .profile-card-inf {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            align-items: flex-start;
            margin-top: 35px;
        }
        .profile-card-inf__item {
            padding: 10px 35px;
            min-width: 150px;
        }
        @media screen and (max-width: 768px) {
            .profile-card-inf__item {
                padding: 10px 20px;
                min-width: 120px;
            }
        }
        .profile-card-inf__title {
            font-weight: 700;
            font-size: 27px;
            color: #324e63;
        }
        .profile-card-inf__txt {
            font-weight: 500;
            margin-top: 7px;
        }

        /* Social Icons */
        .profile-card-social {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .profile-card-social__item {
            display: inline-flex;
            width: 55px;
            height: 55px;
            margin: 15px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            color: #fff;
            background: #405de6;
            box-shadow: 0 7px 30px rgba(43, 98, 169, 0.5);
            position: relative;
            font-size: 21px;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        @media screen and (max-width: 768px) {
            .profile-card-social__item {
                width: 50px;
                height: 50px;
                margin: 10px;
            }
        }
        @media screen and (min-width: 768px) {
            .profile-card-social__item:hover {
                transform: scale(1.2);
            }
        }
        .profile-card-social__item.facebook {
            background: linear-gradient(45deg, #1E56C2, #3B82F6, #60A5FA);
            box-shadow: 0 4px 30px rgba(59, 130, 246, 0.5);
        }
        .profile-card-social__item.twitter {
            background: linear-gradient(45deg, #1da1f2, #0e71c8);
            box-shadow: 0 4px 30px rgba(19, 127, 212, 0.7);
        }
        .profile-card-social__item.instagram {
            background: linear-gradient(45deg, #4C5FD7, #C13584, #F56040, #FCAF45);
            box-shadow: 0 4px 30px rgba(193, 53, 132, 0.6);
        }
        .profile-card-social__item.github {
            background: #FF0000;
            box-shadow: 0 4px 30px rgba(150, 0, 0, 0.5);
        }
        .profile-card-social__item.link {
            background: linear-gradient(45deg, #d5135a, #f05924);
            box-shadow: 0 4px 30px rgba(223, 45, 70, 0.6);
        }
        .profile-card-social .icon-font {
            display: inline-flex;
        }

        /* Buttons */
        .profile-card-ctr {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
        }
        @media screen and (max-width: 576px) {
            .profile-card-ctr {
                flex-wrap: wrap;
            }
        }
        .profile-card__button {
            background: none;
            border: none;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 19px;
            margin: 15px 35px;
            padding: 15px 40px;
            min-width: 201px;
            border-radius: 50px;
            min-height: 55px;
            color: #fff;
            cursor: pointer;
            backface-visibility: hidden;
            transition: all 0.3s;
        }
        @media screen and (max-width: 768px) {
            .profile-card__button {
                min-width: 170px;
                margin: 15px 25px;
            }
        }
        @media screen and (max-width: 576px) {
            .profile-card__button {
                min-width: inherit;
                margin: 0;
                margin-bottom: 16px;
                width: 100%;
                max-width: 300px;
            }
            .profile-card__button:last-child {
                margin-bottom: 0;
            }
        }
        .profile-card__button:focus {
            outline: none !important;
        }
        @media screen and (min-width: 768px) {
            .profile-card__button:hover {
                transform: translateY(-5px);
            }
        }
        .profile-card__button.button--blue {
            background: linear-gradient(45deg, #1da1f2, #0e71c8);
            box-shadow: 0 4px 30px rgba(19, 127, 212, 0.4);
        }
        .profile-card__button.button--blue:hover {
            box-shadow: 0 7px 30px rgba(19, 127, 212, 0.75);
        }
        .profile-card__button.button--orange {
            background: linear-gradient(45deg, #d5135a, #f05924);
            box-shadow: 0 4px 30px rgba(223, 45, 70, 0.35);
        }
        .profile-card__button.button--orange:hover {
            box-shadow: 0 7px 30px rgba(223, 45, 70, 0.75);
        }
        .profile-card__button.button--gray {
            box-shadow: none;
            background: #dcdcdc;
            color: #142029;
        }

        /* Message Box */
        .profile-card-message {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            padding-top: 130px;
            padding-bottom: 100px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
        }
        .profile-card-form {
            box-shadow: 0 4px 30px rgba(15, 22, 56, 0.35);
            max-width: 80%;
            margin-left: auto;
            margin-right: auto;
            height: auto;
            background: #fff;
            border-radius: 10px;
            padding: 35px;
            transform: scale(0.8);
            position: relative;
            z-index: 3;
            transition: all 0.3s;
        }
        @media screen and (max-width: 768px) {
            .profile-card-form {
                max-width: 90%;
            }
        }
        @media screen and (max-width: 576px) {
            .profile-card-form {
                padding: 20px;
            }
        }
        .profile-card-form__bottom {
            justify-content: space-between;
            display: flex;
        }
        @media screen and (max-width: 576px) {
            .profile-card-form__bottom {
                flex-wrap: wrap;
                gap: 10px;
            }
        }
        .profile-card textarea {
            width: 100%;
            resize: none;
            height: 210px;
            margin-bottom: 20px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px 20px;
            color: #324e63;
            font-weight: 500;
            font-family: 'Quicksand', sans-serif;
            outline: none;
            transition: all 0.3s;
        }
        .profile-card textarea:focus {
            outline: none;
            border-color: #8a979e;
        }
        .profile-card__overlay {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            opacity: 0;
            background: rgba(22, 33, 72, 0.35);
            border-radius: 12px;
            transition: all 0.3s;
        }

        /* === Heart animation (thả tim) === */
        .heart {
            width: 10px;
            height: 10px;
            position: fixed;
            background: #f00;
            transform: rotate(45deg);
            -webkit-transform: rotate(45deg);
            -moz-transform: rotate(45deg);
            z-index: 99999;
            pointer-events: none;
        }
        .heart:after,
        .heart:before {
            content: '';
            width: inherit;
            height: inherit;
            background: inherit;
            border-radius: 50%;
            position: absolute;
        }
        .heart:after {
            top: -5px;
            left: 0;
        }
        .heart:before {
            left: -5px;
            top: 0;
        }

        /* Snowflake (tuyết rơi) */
        .snowflake {
            position: absolute;
            top: -50px;
            z-index: 1000;
            pointer-events: none;
            user-select: none;
            opacity: 0.8;
        }
    </style>
</head>

                <div class="profile-card-social">

                    <a class="profile-card-social__item twitter" href="https://t.me/qtinh_1" target="_blank">
                        <span class="icon-font"><svg class="icon"><use xlink:href="#icon-twitter"></use></svg></span>
                    </a> 
                    <a class="profile-card-social__item github" href="https://www.youtube.com/@TTPTOOL_1" target="_blank">
                        <span class="icon-font"><svg class="icon"><use xlink:href="#icon-github"></use></svg></span>
                    </a>
                    <a class="profile-card-social__item link" href="https://nguyentantai238.github.io/ttp_tool/" target="_blank">
                        <span class="icon-font"><svg class="icon"><use xlink:href="#icon-link"></use></svg></span>
                    </a>
                </div>
                
                <div class="profile-card-ctr">
                    <button class="profile-card__button button--blue js-message-btn">Message</button>
                    <button class="profile-card__button button--orange" onclick="window.open('https://www.facebook.com/tran.quoc.tinh.559755')">Follow</button>
                </div>
            </div>
            
            <!-- Message popup -->
            <div class="profile-card-message js-message">
                <form class="profile-card-form">
                    <div class="profile-card-form__container">
                        <textarea placeholder="Cảm ơn bạn đã quan tâm. Hiện tại, tính năng này chưa khả dụng, vui lòng thử lại sau. Chúc bạn một ngày tốt lành !"></textarea>

                    <div class="profile-card-form__bottom">

                        <button class="profile-card__button button--gray js-message-close">Cancel</button>
                    </div>
                </form>
                <div class="profile-card__overlay js-message-close"></div>
            </div>
        </div>
    </div>

    <script>
        // ====================== 1. XỬ LÝ KEY TỪ URL ======================
        function getKeyFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            let key = urlParams.get('key');
            if (key) return key.toUpperCase();
            // Kiểm tra hash fragment
            if (window.location.hash && window.location.hash.includes('key=')) {
                const hashMatch = window.location.hash.match(/[#&?]key=([^&]+)/);
                if (hashMatch) return hashMatch[1].toUpperCase();
            }
            // Kiểm tra đường dẫn /key/autool/...
            const path = window.location.pathname;
            const pathMatch = path.match(/\/key\/autool\/([A-Za-z0-9]+)/i);
            if (pathMatch && pathMatch[1]) return pathMatch[1].toUpperCase();
            return null; // không có key thì không hiển thị
        }

        document.addEventListener('DOMContentLoaded', function() {
            const keyValue = getKeyFromURL();
            const keyDisplayDiv = document.getElementById('key-display');
            if (keyValue && keyDisplayDiv) {
                keyDisplayDiv.style.display = 'inline-block';
                keyDisplayDiv.innerHTML = `🔑 KEY TOOL : <strong>${keyValue}</strong>`;
            } else if (keyDisplayDiv) {
                keyDisplayDiv.style.display = 'none';
            }
        });

        // ====================== 2. ANIMATE SỐ (Followers, Following, Posts, Works) ======================
        function animateNumber(finalNumber, duration, startNumber, callback) {
            let currentNumber = startNumber;
            const stepTime = 17;
            const totalSteps = duration / stepTime;
            const increment = (finalNumber - startNumber) / totalSteps;
            const interval = setInterval(() => {
                currentNumber += increment;
                if (currentNumber >= finalNumber) {
                    currentNumber = finalNumber;
                    clearInterval(interval);
                }
                callback(Math.floor(currentNumber));
            }, stepTime);
        }

        document.addEventListener('DOMContentLoaded', function() {
            animateNumber(100000, 5000, 0, (val) => {
                document.getElementById('count-followers').innerText = val.toLocaleString();
            });
            animateNumber(1, 5000, 0, (val) => {
                document.getElementById('count-following').innerText = val.toLocaleString();
            });
            animateNumber(68, 5000, 0, (val) => {
                document.getElementById('count-posts').innerText = val.toLocaleString();
            });
            animateNumber(2, 5000, 0, (val) => {
                document.getElementById('count-works').innerText = val.toLocaleString();
            });
        });

        // ====================== 3. MESSAGE BOX (active class) ======================
        const messageBox = document.querySelector('.js-message');
        const msgBtn = document.querySelector('.js-message-btn');
        const card = document.querySelector('.js-profile-card');
        const closeBtns = document.querySelectorAll('.js-message-close');

        if (msgBtn) {
            msgBtn.addEventListener('click', function(e) {
                e.preventDefault();
                card.classList.add('active');
            });
        }
        closeBtns.forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                card.classList.remove('active');
            });
        });

        // ====================== 4. HIỆU ỨNG THẢ TIM ======================
        (function() {
            const hearts = [];
            function getRandomColor() {
                return `rgb(${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)})`;
            }
            function createHeart(event) {
                const heart = document.createElement("div");
                heart.className = "heart";
                const color = getRandomColor();
                hearts.push({
                    el: heart,
                    x: event.clientX - 5,
                    y: event.clientY - 5,
                    scale: 1,
                    alpha: 1,
                    color: color
                });
                document.body.appendChild(heart);
            }
            function animateHearts() {
                for (let i = 0; i < hearts.length; i++) {
                    if (hearts[i].alpha <= 0) {
                        if (hearts[i].el && hearts[i].el.parentNode) hearts[i].el.parentNode.removeChild(hearts[i].el);
                        hearts.splice(i, 1);
                        continue;
                    }
                    hearts[i].y -= 1.2;
                    hearts[i].scale += 0.006;
                    hearts[i].alpha -= 0.012;
                    hearts[i].el.style.cssText = `left:${hearts[i].x}px;top:${hearts[i].y}px;opacity:${hearts[i].alpha};transform:scale(${hearts[i].scale},${hearts[i].scale}) rotate(45deg);background:${hearts[i].color};z-index:99999;position:fixed;pointer-events:none;`;
                }
                requestAnimationFrame(animateHearts);
            }
            window.onclick = function(event) {
                createHeart(event);
            };
            animateHearts();
        })();

        // ====================== 5. TUYẾT RƠI ======================
        (function() {
            const snowmax = 40;
            const snowcolor = ["#aaaacc", "#ddddff", "#ccccdd", "#f3f3f3", "#f0ffff"];
            const snowtype = ["Times", "Arial", "Segoe UI", "Verdana"];
            const snowletter = "❄️";
            const sinkspeed = 0.6;
            const snowmaxsize = 28;
            const snowminsize = 10;
            let marginbottom, marginright;
            let snowArray = [];
            let x_mv = [], crds = [], lftrght = [];

            function randommaker(range) {
                return Math.floor(Math.random() * range);
            }

            function initsnow() {
                marginbottom = document.body.scrollHeight;
                marginright = window.innerWidth - 20;
                const snowsizerange = snowmaxsize - snowminsize;
                for (let i = 0; i <= snowmax; i++) {
                    crds[i] = 0;
                    lftrght[i] = Math.random() * 15;
                    x_mv[i] = 0.03 + Math.random() / 10;
                    const snowflake = document.createElement("span");
                    snowflake.className = "snowflake";
                    snowflake.id = "s" + i;
                    snowflake.style.fontFamily = snowtype[randommaker(snowtype.length)];
                    let size = randommaker(snowsizerange) + snowminsize;
                    snowflake.style.fontSize = size + "px";
                    snowflake.style.color = snowcolor[randommaker(snowcolor.length)];
                    snowflake.style.position = "absolute";
                    snowflake.style.top = "-50px";
                    snowflake.style.zIndex = "999";
                    snowflake.style.pointerEvents = "none";
                    snowflake.sink = sinkspeed * size / 6;
                    snowflake.posx = randommaker(marginright - size);
                    snowflake.posy = randommaker(2 * marginbottom - marginbottom - 2 * size);
                    snowflake.style.left = snowflake.posx + "px";
                    snowflake.style.top = snowflake.posy + "px";
                    snowflake.innerHTML = snowletter;
                    document.body.appendChild(snowflake);
                    snowArray.push(snowflake);
                }
                movesnow();
            }

            function movesnow() {
                for (let i = 0; i < snowArray.length; i++) {
                    const flake = snowArray[i];
                    crds[i] += x_mv[i];
                    flake.posy += flake.sink;
                    flake.style.left = flake.posx + lftrght[i] * Math.sin(crds[i]) + "px";
                    flake.style.top = flake.posy + "px";
                    if (flake.posy >= marginbottom - 2 * parseInt(flake.style.fontSize) || parseInt(flake.style.left) > (marginright - 3 * lftrght[i])) {
                        flake.posx = randommaker(marginright - parseInt(flake.style.fontSize));
                        flake.posy = -20;
                    }
                }
                requestAnimationFrame(movesnow);
            }
            window.addEventListener('load', function() {
                setTimeout(initsnow, 200);
            });
        })();

        // Đảm bảo video autoplay
        const videoBg = document.querySelector('.video-background');
        if(videoBg) videoBg.play().catch(e => console.log("autoplay muted ok"));
    </script>
